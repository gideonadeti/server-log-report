name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n report.sh

      - name: Generate a sample log
        run: ./sample/generate-log.sh 300 > /tmp/access.log

      - name: Markdown report
        run: ./report.sh --log /tmp/access.log --out-dir /tmp/out --top 3

      - name: JSON report
        run: |
          ./report.sh --log /tmp/access.log --json > /tmp/report.json
          jq -e '.summary.requests == 300' /tmp/report.json
          jq -e '.summary.status_5xx > 0' /tmp/report.json
          jq -e '.top_paths | length == 5' /tmp/report.json

      - name: vhost_combined format
        run: |
          sed 's/^/example.com:443 /' /tmp/access.log > /tmp/vhost.log
          ./report.sh --log /tmp/vhost.log --format vhost_combined --json \
            | jq -e '.summary.requests == 300'

      - name: Custom fields
        run: |
          ./report.sh --log /tmp/vhost.log --fields 2,8,10,11 --json \
            | jq -e '.format == "custom(2,8,10,11)"'

      - name: CSV output
        run: |
          ./report.sh --log /tmp/access.log --csv > /tmp/report.csv
          head -1 /tmp/report.csv | grep -q '^section,key,value$'
          grep -q '^summary,requests,300$' /tmp/report.csv
          python3 -c "import csv; r=list(csv.reader(open('/tmp/report.csv'))); assert all(len(x)==3 for x in r); print(len(r), 'rows OK')"

      - name: --since filtering
        run: |
          sed 's#08/Nov/2026#01/Nov/2026#' /tmp/access.log > /tmp/mixed.log
          cat /tmp/access.log >> /tmp/mixed.log
          ./report.sh --log /tmp/mixed.log --since 2026-11-05 --json \
            | jq -e '.summary.requests == 300 and .since == "2026-11-05"'
          ./report.sh --log /tmp/mixed.log --since 2026-11-01 --json \
            | jq -e '.summary.requests == 600'
          ./report.sh --log /tmp/mixed.log --since 2026-11-09 --json \
            | jq -e '.summary.requests == 0'

      - name: --json and --csv are mutually exclusive
        run: |
          if ./report.sh --log /tmp/access.log --json --csv; then
            echo "expected failure" >&2
            exit 1
          fi

      - name: Health check against a local server
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          ./report.sh --health-only --url http://localhost:3000 --json \
            | jq -e '.up == true'

      - name: Missing log should fail
        run: |
          if ./report.sh --log /tmp/does-not-exist.log; then
            echo "expected failure" >&2
            exit 1
          fi

      - name: Unknown format should fail
        run: |
          if ./report.sh --log /tmp/access.log --format nope; then
            echo "expected failure" >&2
            exit 1
          fi
